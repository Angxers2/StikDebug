workflows:
  unsigned-ipa:
    name: StikDebug Trips (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    when:
      changeset:
        excludes: [ "trips/**", ".trip-test/**" ]
    scripts:
      - name: Build unsigned IPA (sign it in Feather)
        script: |
          set -o pipefail
          brew install xcodegen >/dev/null && xcodegen generate > build.log 2>&1
          # reuse upstream's pinned package versions
          mkdir -p StikDebugGen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp StikDebug.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved StikDebugGen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          xcodebuild -version >> build.log 2>&1
          xcodebuild -project StikDebugGen.xcodeproj -scheme StikDebug -configuration Debug \
            -destination generic/platform=iOS -derivedDataPath build/dd -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" build 2>&1 | tee -a build.log | grep -E "error:|BUILD" | head -80 || true
          APP=build/dd/Build/Products/Debug-iphoneos/StikDebug.app
          if [ -f "$APP/Info.plist" ]; then
            mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry StikDebug-Trips.ipa Payload
          else
            echo "BUILD FAILED, see build.log" | tee -a build.log
          fi
    artifacts:
      - StikDebug-Trips.ipa
      - build.log
