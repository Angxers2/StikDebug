workflows:
  unsigned-ipa:
    name: StikDebug Trips (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    when:
      changeset:
        excludes: [ "trips/**", ".trip-test/**" ]
    scripts:
      - name: Build unsigned IPA (sign it in Feather)
        script: |
          xcodebuild -version
          xcodebuild clean archive \
            -project StikDebug.xcodeproj -scheme StikDebug -configuration Debug \
            -archivePath build/StikDebug.xcarchive -sdk iphoneos \
            -destination 'generic/platform=iOS' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" IPHONEOS_DEPLOYMENT_TARGET=17.4
          mkdir -p Payload
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/
          zip -qr StikDebug-Trips.ipa Payload
    artifacts:
      - StikDebug-Trips.ipa
